<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Snap + Fade/Shift</title>

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    /* Scroll container */
    .container {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    /* Rows */
    .row {
      height: 100vh;
      scroll-snap-align: start;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 3rem;
      color: white;

      /* Initial hidden state */
      opacity: 0;
      transform: translateX(100px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    /* Active (in view) state */
    .row.in-view {
      opacity: 1;
      transform: translateY(0);
    }

    /* Backgrounds */
    .row:nth-child(1) { background: #1abc9c; }
    .row:nth-child(2) { background: #3498db; }
    .row:nth-child(3) { background: #9b59b6; }
    .row:nth-child(4) { background: #e67e22; }
    .row:nth-child(5) { background: #e74c3c; }
    .row:nth-child(6) { background: #2ecc71; }
    .row:nth-child(7) { background: #34495e; }
  </style>
</head>
<body>

  <div class="container">
    <section class="row">Row 1</section>
    <section class="row">Row 2</section>
    <section class="row">Row 3</section>
    <section class="row">Row 4</section>
    <section class="row">Row 5</section>
    <section class="row">Row 6</section>
    <section class="row">Row 7</section>
  </div>

  <script>
    const rows = document.querySelectorAll('.row');

    const observer = new IntersectionObserver(
      entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in-view');
          }
        });
      },
      {
        threshold: 0.6    // triggers when most of the row is visible
      }
    );

    rows.forEach(row => observer.observe(row));
  </script>

</body>
</html>
